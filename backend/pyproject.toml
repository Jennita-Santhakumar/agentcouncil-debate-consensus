[project]
name = "multi-agent-debate-system"
version = "1.0.0"
description = "Multi-agent LangChain debate system with consensus scoring"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
